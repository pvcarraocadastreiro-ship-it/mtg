<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculadora de Mana MTG — v21</title></head>
<body style="margin:0;background:#090d16;color:#f8fafc;font-family:system-ui,sans-serif"><div id="status" style="padding:24px;text-align:center">Carregando Calculadora de Mana MTG v21…</div><script>
(async()=>{try{const base='';const parts=await Promise.all(['v21.part1','v21.part2','v21.part3','v21.part4'].map(p=>fetch(base+p).then(r=>{if(!r.ok)throw new Error('Falha ao carregar '+p);return r.text()})));const b64=parts.join('').replace(/\s/g,'');const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));const text=await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(text);document.close();}catch(e){document.getElementById('status').innerHTML='<h2>Não foi possível carregar a v21</h2><p>'+String(e).replace(/[<>]/g,'')+'</p>';}})();
</script></body></html>
